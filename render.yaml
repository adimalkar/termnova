services:
  # ──── Termnova FastAPI Web Application ────
  - type: web
    name: termnova-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REQUIRE_AUTH
        value: "true"
      - key: API_KEY
        sync: false
      - key: BROWSER_SESSION_TTL_SECONDS
        value: "28800"
      - key: EXPOSE_METRICS
        value: "false"
      - key: CORS_ORIGINS
        value: "[]"
      - key: LLM_PROVIDER
        value: opencode
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_BASE_URL
        value: https://opencode.ai/zen/go/v1
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_FALLBACK_PROVIDER
        value: openrouter
      - key: LLM_FALLBACK_MODEL
        value: deepseek/deepseek-v4-flash
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: LLM_NUM_RETRIES
        value: "2"
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b:free
      - key: EMBEDDING_DIMENSION
        value: "2048"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: termnova-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: termnova-redis
          property: connectionString

  # ──── Redis Distributed Cache ────
  - type: redis
    name: termnova-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ──── PostgreSQL Database with pgvector ────
  - name: termnova-postgres
    plan: starter
    region: oregon
    databaseName: termnova
    user: termnova
    postgresMajorVersion: 16
