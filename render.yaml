services:
  # ──── Termnova FastAPI Web Application ────
  - type: web
    name: termnova-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn termnova.api.main:app --host 0.0.0.0 --port $PORT --workers 2 --limit-concurrency 100
    preDeployCommand: alembic upgrade head
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: opencode
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_FALLBACK_PROVIDER
        value: openrouter
      - key: LLM_FALLBACK_MODEL
        value: deepseek/deepseek-v4-flash
      - key: OPENCODE_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: USE_LLM_GRADER
        value: "false"
      - key: USE_LLM_REWRITE
        value: "false"
      - key: USE_RERANKER
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: termnova-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: termnova-redis
          property: connectionString

  - type: worker
    name: termnova-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: opencode
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_FALLBACK_PROVIDER
        value: openrouter
      - key: LLM_FALLBACK_MODEL
        value: deepseek/deepseek-v4-flash
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: USE_RERANKER
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: termnova-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: termnova-redis
          property: connectionString

  # ──── Redis Distributed Cache ────
  - type: redis
    name: termnova-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ──── PostgreSQL Database with pgvector ────
  - name: termnova-postgres
    plan: starter
    region: oregon
    databaseName: termnova
    user: termnova
    postgresMajorVersion: 16
