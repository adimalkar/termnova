name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality tooling
        run: python -m pip install "ruff>=0.5" "build>=1.2"

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Validate Python syntax
        run: python -m compileall -q src alembic

      - name: Build Python distributions
        run: python -m build

  test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: termnova
          POSTGRES_PASSWORD: termnova_dev
          POSTGRES_DB: termnova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U termnova -d termnova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://termnova:termnova_dev@localhost:5432/termnova_test
      DATABASE_URL_SYNC: postgresql://termnova:termnova_dev@localhost:5432/termnova_test
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      APP_ENV: test
      PGPASSWORD: termnova_dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]"

      - name: Enable pgvector and apply migrations
        run: |
          psql -h localhost -U termnova -d termnova_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          alembic upgrade head
          alembic check

      - name: Run test suite with coverage gate
        run: >-
          pytest tests -q
          --cov=src/termnova
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=65

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build web image
        run: docker build --pull --tag termnova-web:${{ github.sha }} --file Dockerfile .

      - name: Build worker image when present
        run: |
          if [ -f Dockerfile.worker ]; then
            docker build --pull --tag termnova-worker:${{ github.sha }} --file Dockerfile.worker .
          fi
