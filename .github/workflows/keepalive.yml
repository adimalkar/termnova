name: Production Health Monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    name: Verify production readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HEALTH_URL: https://termnova.onrender.com/health
    steps:
      - name: Check application and database health
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 25 \
              --output /tmp/termnova-health.json "$HEALTH_URL" \
              && jq -e '.status == "healthy" and .database == "healthy"' \
                /tmp/termnova-health.json >/dev/null; then
              jq . /tmp/termnova-health.json
              echo "Production readiness check passed on attempt $attempt."
              exit 0
            fi

            echo "Production readiness check failed on attempt $attempt of 3."
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done

          if [ -f /tmp/termnova-health.json ]; then
            jq . /tmp/termnova-health.json || cat /tmp/termnova-health.json
          fi
          echo "Production remained unhealthy after all retries." >&2
          exit 1
