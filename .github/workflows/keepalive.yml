name: Production Keep-Alive & Uptime Monitor

on:
  schedule:
    # Trigger every 10 minutes to prevent Render free-tier instance sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Keep-Alive Health Ping
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Termnova Health Endpoint
        run: |
          echo "Sending keep-alive ping to Termnova production endpoint..."
          
          for i in {1..3}; do
            echo "Ping Attempt $i..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://termnova.onrender.com/health || echo "000")
            echo "HTTP Status Code: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Termnova is healthy and awake!"
              break
            else
              echo "⚠️ Instance was sleeping or returned non-200. Retrying in 15 seconds..."
              sleep 15
            fi
          done
