[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termnova"
version = "0.2.0"
description = "Production-grade AI Contract Intelligence Platform with Hybrid RAG, LangGraph Agents, OpenTelemetry, Celery Queues, and Responsible Guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditya Malkar", email = "amalkar@stevens.edu" }
]

dependencies = [
    # Core settings & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # Async database & ORM
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.3.0",
    # Utilities & Resiliency
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "redis>=5.0.3",
    "websockets>=12.0",
]
pipeline = [
    "pypdf>=4.1.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]
ml = [
    "sentence-transformers>=3.0.0",
]
llm = [
    "litellm>=1.40.0",
    "tiktoken>=0.7.0",
]
agents = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
queue = [
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",
]
observability = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]
security = [
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]
eval = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "reportlab>=4.1.0",
    "fpdf2>=2.7.8",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "locust>=2.29.0",
]
all = [
    "termnova[api,pipeline,ml,llm,agents,queue,observability,security,eval,dev]",
]

[project.scripts]
termnova = "termnova.pipeline.ingestion:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termnova"]

# ──────────────────────────────────────────────
# Ruff Linter & Formatter
# ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in argument defaults (standard for FastAPI Depends)
    "TC003", # type checking blocks
    "N802",  # function name capitalization
]

[tool.ruff.lint.isort]
known-first-party = ["termnova"]

# ──────────────────────────────────────────────
# Mypy Type Checker
# ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

# ──────────────────────────────────────────────
# Pytest Options
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "unit: Fast isolated unit tests (no DB or external calls)",
    "integration: Integration tests requiring local PostgreSQL and Redis",
    "e2e: End-to-end API tests against the running FastAPI stack",
]
addopts = "-v --tb=short"
